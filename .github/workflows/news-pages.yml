name: Collect news and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
concurrency:
  group: news-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Verify collection and reader
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/news-model.test.mjs
          node --check assets/app.js
          node --check assets/exports.js
      - name: Read previous successful edition
        run: python3 scripts/persist_snapshot.py load .previous.json
      - name: Collect current news
        env:
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
          GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
          CURRENTS_KEY: ${{ secrets.CURRENTS_KEY }}
          GUARDIAN_KEY: ${{ secrets.GUARDIAN_KEY }}
          NYT_KEY: ${{ secrets.NYT_KEY }}
        run: python3 scripts/collect_news.py --previous .previous.json --output data/news.json
      - name: Preserve edition for outage recovery
        run: python3 scripts/persist_snapshot.py save data/news.json
      - name: Package public website only
        run: |
          mkdir -p _site/data
          cp index.html favicon.svg .nojekyll _site/
          cp -R assets config _site/
          cp data/news.json _site/data/news.json
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
